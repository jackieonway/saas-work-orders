name: Independent business CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: npm install --global npm@11.16.0
      - run: node ../backend/scripts/check-inputs.mjs
      - run: node --test ../backend/acceptance/repository-structure.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build -- --allowed-host-origin https://platform.example.com
      - run: npm test
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --lib
      - run: cargo clippy --locked --all-targets -- -D warnings
