name: Independent business CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: npm install --global npm@11.16.0
      - run: node ../.github/scripts/check-inputs.mjs
      - run: node --test ../.github/tests/repository-structure.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build -- --allowed-host-origin https://platform.example.com
      - name: Verify actual qiankun UMD release and current source fingerprints
        run: npm run release:check -- dist
      - run: npm test
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: npm install --global npm@11.16.0
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --lib
      - name: Verify the optional owned Node HTTP fixture
        run: cargo test --locked --lib -- --test-threads=1
        env:
          WORK_ORDERS_TEST_NODE: node
      - run: cargo clippy --locked --all-targets -- -D warnings

  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        directory: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build this application image
        run: >-
          docker build --build-arg APP_CODE=work-orders
          --build-arg APP_VERSION=ci-${{ github.run_number }}
          --build-arg HOST_ORIGIN=https://platform.example.com
          --build-arg API_BASE=/work-orders-api
          --build-arg SOURCE_REVISION=${{ github.sha }}
          -t saas-work-orders-${{ matrix.directory }}:ci ${{ matrix.directory }}
