[package]
name = "work-orders-api"
version = "0.1.0"
edition = "2021"
description = "Independent Rust work-order API and safe business database baseline takeover"
publish = false

[dependencies]
operational-telemetry = { path = "../../../crates/operational-telemetry" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "migrate"] }
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
url = { version = "2", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = 1
